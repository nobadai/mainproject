server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep these before the generic /api/ mapping.  They mirror the development
    # rewrites in next.config.ts while resolving the backend through Compose DNS.
    location /api/screen/ {
        proxy_pass http://backend:8000/api/;
        include /etc/nginx/proxy_params;
    }

    location /api/console/ {
        proxy_pass http://backend:8000/api/console/;
        include /etc/nginx/proxy_params;
    }

    location /api/ml/ {
        proxy_pass http://backend:8000/ml/console/;
        include /etc/nginx/proxy_params;
    }

    # Agent APIs: /api/master/... -> backend /master/... (and likewise for
    # finance, sales, logistics, and the deployment /api/health probe).
    location /api/ {
        proxy_pass http://backend:8000/;
        include /etc/nginx/proxy_params;
    }

    # Next static export writes both .html files and directory indexes.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
