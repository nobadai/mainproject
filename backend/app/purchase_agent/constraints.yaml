# 매입 에이전트 도메인 임계·상수 — 단일 소스
#
# 출처: docs/매입에이전트_상세설계_v1.1.md §7 (일부 IO명세 §1)
#
# CLAUDE.md 규칙 7: 임계를 코드에 하드코딩하지 않는다. self_check·Critic이 이 파일을 공유하고,
#                   config 오버라이드와 feedback의 constraint 덮어쓰기도 이 값 위에서 일어난다.
# CLAUDE.md 규칙 3: 미결값은 null. 0으로 채우면 에러 없이 결과만 조용히 틀어진다.
#
# 여기에 두지 않는 것 (상세설계 §7 각주):
#   contract_price(계약단가) · margin_defense_floor_rate(방어선) · 역마진 임계
#   → 재무·영업이 공급하는 **입력값**이지 매입의 상수가 아니다. T0 스냅샷으로 받는다.

version: "1.1"

# ① classify_situation — 신뢰구간 폭으로 stable / uncertain 판정
situation:
  # ci_width = (upper - lower) / predicted
  # 상세설계 §4-①: ci_width < 0.08 -> stable, ci_width >= 0.08 -> uncertain
  # 경계값 0.08 자신은 uncertain이다 ("넘으면"이 아니라 "이상")
  ci_width_threshold: 0.08          # ±8%
  ci_width_comparison: ">="         # 이 연산으로 임계와 비교하면 uncertain
  # 판정 기준일 = D+14 단일 (상세설계 §4-①, Epic 2 확정).
  #   ci_width = (daily[13].upper - daily[13].lower) / daily[13].predicted
  #   daily가 D+1부터 시작하므로 D+14는 index 13이다 — 이 매핑이 어긋나면 판정이 통째로 밀린다.
  # 왜 "전 구간 최대"가 아닌가: ML 신뢰구간은 지평에 단조 확대되는 게 일반적이라 전 구간
  #   최대는 사실상 D+18의 ci가 되고, 판정이 꼬리에 인질로 잡혀 uncertain이 남발된다
  #   (= 공격안 소멸). D+14는 rise_rate_2w와 시점이 같아 "2주 후 전망이 얼마나 확실한가"
  #   라는 하나의 질문으로 묶이고, 여기가 좁으면 그 앞은 대개 더 좁아 상한 검사도 겸한다.
  # 비단조 예측에서 과신이 관찰되면 백테스트 보정 대상이다.
  ci_judgment_day: 14               # D+N. 코드에 박지 않는다 — 규칙 7
  # 상황별 신뢰도. 구간이 좁은 날은 판단 재료가 확실하다. uncertain은 ② 문서 루프를
  # 거쳐도 구간 폭 자체가 넓으므로 high를 주지 않는다.
  confidence_by_situation:
    stable: high
    uncertain: medium

# ③ draft_plan — 수량 = 확정수요 × 커버일수 D
coverage_days:
  min: 2                            # 하한 = JIT baseline
  max: 18                           # 상한 = D+18 지평
  by_label:                         # 상세설계 §7 "3안 D 매핑" (백테스트로 보정 예정)
    보수: 2
    기본: 5                          # §7 표기 "기준" = 출력 label "기본"
    공격: 12

# 축 진입 트리거
triggers:
  pre_purchase_rise_rate: 0.10      # +10% 이상 상승 예상 시 timing 축 진입
  grade_spread_widening_ratio: 0.50 # 평시 대비 +50% 확대 시 중품 활용 검토
  # 분할 진입은 "총수량 임계 초과 OR 지속상승 궤적" 둘 중 하나면 열린다 (정의서 §3.5.1).
  # 이 값은 그중 총수량 쪽 임계다 (백로그 임계표 "분할 진입 | ≥20,000kg").
  # ① 시점엔 아직 수량이 없으므로 최대 D(공격)로 추정한 총량과 비교한다.
  split_entry_qty_kg: 20000

# ④ split_plan — 분할 유형 고정 목록 (상세설계 §4-④ "생성 말고 선택")
split:
  # {일괄, 2분할, 3분할}. 이 목록 밖의 회차 수는 만들지 않는다 — 유형을 "생성"하면
  # 검증할 수 없는 계획이 나온다. 회차 수 = clamp(ceil(최대안 총량 / split_entry_qty_kg), 목록 경계).
  # "진입했으면 최소 2회차"를 별도 상수로 두지 않는다 — **1보다 큰 최소 유형이 곧 그 값**이다.
  # 같은 사실을 두 곳에 적으면 한쪽만 바뀐다.
  types: [1, 2, 3]

# mix 축 게이팅 — 한 품목이 이 비중을 넘으면 품목 조합의 의미가 사라진다
concentration:
  item_threshold: 0.70              # item_concentration_threshold
  segment_threshold: 0.70           # segment_concentration_threshold (영업 소유 — 이름만 분리)

# 안 사이 차이가 너무 작으면 "3안"이 사실상 1안이다
variant:
  collapsed_threshold: 0.15         # (max - min) / max < 0.15 → variant_collapsed (판정은 T3)
  clip_warning_threshold: 0.30      # clipped / 원안 < 0.30 → 과도 클리핑 경고

costs:
  delivery_cost_per_kg: 10          # 가락 → 창고 배송비. 상수, 전 시나리오 동일

# ③ 하드 제약 — 매입액이 향후 최저 예상 현금을 다 쓰지 않게 막는다
cash:
  # 백로그 임계표 "현금 상한 | 가용현금 비율 | 60%".
  # base_projected_cash_min에 곱해 매입 가능액 상한을 만든다 (IO명세 §1-⑤).
  max_purchase_ratio: 0.60
  # 최저 현금을 몇 일 지평으로 볼 것인가. IO명세 §1-⑤ "N >= 회수주기(D+30)".
  horizon_days: 30

grade:
  mid_grade_shelf_ratio: 0.6        # 중품 소진 한계 = 상품 한계일 × 0.6 (등급-신선도 연동)
  # 기준등급(allocation.reference_grade)의 짝. ⑤는 상/중 2등급만 다룬다 — 특 활용은 범위 밖.
  mid_grade: "중"
  # 평시 등급 스프레드 기준선 = (P상 − P중) / P상. **SIM_FIXED 선언값**이다.
  # 과거 시세 이력 포트가 IO명세 §1의 계약 6개에 없어 통계를 낼 수 없다 (§4-⑤ Epic 3 확정 1).
  # 값은 quotes_normal.json의 평시 스프레드와 같다 — test_contracts가 둘을 대조한다.
  # 실데이터로 가면 이 상수가 아니라 직전 N일 통계를 쓴다. 교체 지점은 코드 한 곳뿐이다:
  # allocate_sourcing.baseline_spread(). 호출부는 바뀌지 않는다.
  baseline_grade_spread:
    배추: 0.121
    무: 0.118
    양파: 0.119
    피마늘: 0.119
  # ⑤ 중품 채택 스코어의 가중치. score = w_price × 단가이득 − w_fresh × 신선도리스크.
  # **평시 중품 비중 같은 결과값 상수는 두지 않는다** — 배분은 스코어링의 출력이지 상수가
  # 아니다 (§4-⑤ Epic 3 확정 2). 여기 있는 건 판단의 기울기이고 백테스트로 보정한다.
  score_weights:
    price_gain: 1.0
    freshness_risk: 0.30
  # 이 미만 비중은 배분으로 치지 않는다. round()가 0kg을 만들면 스키마(qty_kg > 0)가
  # **제안 전체**를 죽인다 — 의미 없는 한 줄 때문에 그날 산출물이 통째로 사라지는 걸 막는다.
  min_share: 0.01
  # ⑤ E3-2 — LLM이 고를 후보를 만드는 배수 (중품 cap 대비).
  # 규칙이 후보를 만들고 LLM은 그중 **하나를 고르기만** 한다 (§4-⑤ E3-2 확정).
  # 0.0(=전량 기준등급)이 목록에 있어야 "중품 안 씀"도 선택지가 되고, 1.0은 현행 규칙이
  # 고르는 값이라 **LLM이 실패해도 지금 산출물이 그대로 나온다** — 이게 fallback 기본안이다.
  # 배수를 늘려도 cap을 넘지 못하므로 "중품 과다"는 LLM 실수로 만들어질 수 없다.
  mix_candidate_fractions: [0.0, 0.5, 1.0]
  # ⑤ E3-2 — 판단 사유의 길이 상한(자). 이 값을 넘으면 재시도한다.
  # 사유는 rationale.claim에 그대로 실리므로 길면 H1 화면이 읽기 어려워진다.
  # ② excerpt_max_chars와 같은 성격의 출력 형식 임계라 같은 자리에 둔다 (규칙 7).
  mix_reason_max_chars: 300

demand:
  # 확정주문 조회 창(일). ③이 이 창의 평균으로 일평균 확정수요를 낸다 (상세설계 §4-③).
  # 스냅샷을 만들 때와 수요를 계산할 때가 같은 창이어야 한다 — 두 곳이 각자 14를 들고
  # 있으면 한쪽만 바뀌는 순간 수량이 조용히 틀어진다. 그래서 여기 단일 소스로 둔다.
  order_window_days: 14
  # ⚠️ legacy — ③ draft_plan에서 곱하지 않는다.
  # 상세설계 §4-③: 기존 "확정주문 + 안전재고 20%"는 커버일수 D≈2.4의 특수 케이스였고
  # D 방식이 그것을 일반화했다. 둘 다 적용하면 이중 계상이 된다.
  # 값을 지우지 않는 이유: 백테스트에서 구방식과 D 방식을 비교할 때 참조한다.
  safety_stock_ratio: 0.20

warehouse:
  rental_cap_ratio: 0.30            # 외부임차 한도 = 총용량 × 30% (IO명세 §1-③)

# ② collect_context — 문서 선택 로드 루프 (상세설계 §4-②)
context:
  loop_max: 3                       # ② collect_context 재진입 상한 (상세설계 §3)
  # 읽을 순서. 상세설계 §4-② "우선순위(프롬프트 명시): 관측월보 → 기상 → 작년 동기".
  # 코드에 박지 않는 이유는 규칙 7 그대로다. 여기 값은 mock 코퍼스의 doc_type과 정합해야
  # 하고(없는 유형을 요청하면 포트가 ValueError), 그 정합은 계약 테스트가 잠근다.
  # ⚠️ 지금 길이(3)가 loop_max(3)와 같다. 우연이다 — "상한에서 멈췄다"와 "목록을 다 썼다"가
  #    mock에서 구분되지 않으므로, 상한이 실제로 무는지는 합성 입력 테스트가 따로 본다.
  doc_type_priority: ["관측월보", "기상", "작년동기"]
  # 인용 발췌 길이 상한. 첫 문장을 못 찾았을 때의 잘라내기 기준이다.
  # 발췌 자체가 필수인 이유: Critic은 DB 조회가 금지라 원문 없이는 근거 대조가 성립하지
  # 않는다 (현서님 합의 8/25 · IO명세 §0 P2).
  excerpt_max_chars: 120

# 등급별 당일 경락가를 어느 좌표로 읽는가 (#70).
#
# ★ **여섯 축을 전부 여기 적는다** — 코드에 박으면 품목별로 분기가 생기고, ML이 규격을
#   바꿨을 때(2026-08-27) 고칠 자리가 흩어진다 (규칙 7).
#
# ⚠️ **규격을 잠그지 않으면 스프레드가 등급이 아니라 포장 크기를 잰다.**
#   2025-12-31 배추 실측: 규격 무필터로 특 1,107원 · 상 1,499원이라 (P특−P상)/P특 이
#   **−35.4%** 가 되고, 확대 판정이 "확대 아님"으로 조용히 뒤집힌다. 상·중이 특과 다른
#   규격(상자 8kg 쌈배추)으로 거래되기 때문이고, 소포장은 kg당 단가가 몇 배 높다.
market_quotes:
  # 🔴 **ML 수집과 같은 값을 읽는다** (2026-08-31 지환님 확정). ``haetdeul`` 사본은
  #   ML 소관이 아니고 뒤처져 있다 — 같은 날 실측으로 ``haetdeul`` 최신 08-26,
  #   ``source_raw`` 최신 08-29 로 **3일** 차이였다. 사본을 읽으면 우리 rise_rate 분모와
  #   ML 예측이 다른 날의 시장을 보게 된다.
  #
  #   스키마를 여기 적는 이유: 전에는 ``db.get_db_schema()`` 가 ``DB_SCHEMA`` 환경변수에서
  #   가져왔다. 그러면 **.env 가 어느 테이블을 읽을지 정하게** 되고, 팀원마다 값이 달라
  #   같은 코드가 다른 시세를 본다. 좌표는 좌표 있는 자리에 둔다 (규칙 7).
  #   ``source_raw`` 는 FOREIGN 테이블이라 필터 없는 전체 스캔은 피한다 — 우리 쿼리는
  #   ``auction_date`` · 시장 · 품목으로 먼저 좁힌다 (실측 1.8초).
  source:
    schema: "source_raw"
    table: "auction_prices_daily"    # 이 테이블 전체가 경락이다 — 가격종류 컬럼이 없다
  price_kind: "AUC"                  # 그 사실을 선언으로 남긴다. 필터로 쓰지 않는다
  market_category: "가락"             # = wholesale_market_code 110001 서울가락
  unit: "원/kg"
  # 물량가중 = 거래대금 합 ÷ 거래중량 합 (kg 기준 — 건수 아님).
  # 단순평균과 2.1배 갈린다: 2026-08-03 배추 특 물량가중 938.5 vs 단순평균 2,009.9.
  # grade_unit_price 는 사중 일치 금액 축에 직접 걸리므로 식이 틀리면 금액이 두 배 어긋난다.
  weighting: "volume"
  # 🔴 **as_of 이전 최신 거래일**을 쓴다 — 당일이 아니다. 우리는 아침에 돌고(상세설계
  #   §128 · 역할계약서 §45), 그 시각엔 당일 경매가 끝나지 않았다.
  #
  # **"오늘 기준 0행"은 고장이 아니라 정상 동작이다** — 오늘 경매는 오늘 밤에 끝난다.
  # ML 수집기가 어제치를 받으므로 평시 지연은 **1일**이다 (ML 회신 2026-08-31).
  #
  # ── 왜 달력일이 아니라 거래일인가 ──────────────────────────────────────────
  #
  # 재려는 것은 *"시장이 쉬었나"* 가 아니라 *"우리 값이 시장보다 뒤처졌나"* 다. 달력일로
  # 세면 주말·연휴가 그대로 지연으로 잡혀, **연휴 직후 첫 아침**이 반드시 0안이 된다 —
  # 하필 가장 판단이 필요한 아침이다. 2025년 평일 실측으로 그런 날이 13일이었다.
  #
  # 거래일로 세면 그 13일이 사라지고, 진짜 뒤처짐만 남는다 (2026-08-31 실측 · 783건):
  #
  #     거래일 기준  0일 772건(98.6%)  1일 5건(0.6%)  2일 2건  3일 2건  4일 2건
  #     달력일 기준  1일 591건(75.5%)  2일 159건(20.3%)  3일 20건  4일 6건  5일 5건  6일 2건
  #
  # 밀린 11건은 전부 **그 품목·규격이 안 팔린 날**이다 — 설·추석은 한 건도 없다.
  # 배추·무 1/7~10(양파는 정상) · 양파 1/29~31. 연휴 달력으로는 설명되지 않는 공백이라
  # 예외 표를 유지해도 못 잡는다.
  # 시장 개장일을 훑는 창(일). 창을 두는 이유는 source_raw 가 FOREIGN 테이블이라
  # 무경계 스캔이 원격 커넥션을 끊기 때문이다 (2026-08-31 실측 — 실제로 끊겼다).
  # 이 창 밖으로 밀리면 개수가 창 길이에서 멈추는데, 그때는 이미 허용치를 한참 넘어
  # 막히므로 판정이 뒤집히지 않는다.
  market_open_window_days: 30
  # 🔴 **거래일 기준**이다 — 달력일이 아니다. 이름에 그 사실을 담는다.
  #
  # 1을 고른 이유: 그 규격이 하루 안 나오는 것은 시장 두께의 문제라 값이 죽지 않았다고
  # 본다. 이틀 이상 연속이면 그 품목의 가격 형성 자체가 끊긴 것이라 안을 만들지 않는다.
  # 2025년 평일 783건 중 6건(0.8%)이 걸린다 — 배추·무 1/8~1/10, 관측일이 달력 4~6일 전이다.
  max_trading_days_behind: 1
  # ⚠️ **이건 신선도 검사가 아니라 적재 정지 감지다.** 거래일 기준 지연은 시장 전체가
  #   멈추면 0으로 읽힌다 — 우리 관측일과 시장 최신일이 같이 뒤로 밀리기 때문이다.
  #   그 사각을 이 값이 막는다: 시장 전체의 최신 기록이 as_of 로부터 며칠 전인가.
  #
  #   7인 이유는 **연휴를 통과시키면서 가능한 한 좁게**다. 2025년 최장 공백이 6일
  #   (설·추석)이라 7이면 정상 휴장에는 안 걸리고, 적재가 멈추면 8일째 걸린다.
  #   더 좁히려면 공휴일 달력이 필요한데 그걸 안 들이기로 한 것이 위 결정이다.
  max_calendar_days_behind: 7
  # 읽을 등급 어휘. 이 목록 밖(`.`·등외·5~8등·무등급)은 등급이 아니라 잡음이라 버린다.
  # **어느 등급을 실제로 쓸지는 #69 소관**이고, 여기는 "무엇을 읽는가"만 정한다.
  grades: ["특", "상", "중", "하"]
  # 품목별 규격. ML ml_price_forecasts.spec_desc 와 같은 축이어야 같은 시리즈가 된다.
  # ``label`` 은 사유 문장에 그대로 실린다 — "그날 그 규격에 그 등급이 없었다"를 말하려면
  # 무엇을 봤는지가 사람이 읽는 말로 나가야 한다.
  spec_by_item:
    배추: {packages: ["그물망", "파렛트"], unit_weight_kg: 10, label: "그물망·파렛트 10kg"}
    무:
      packages: ["상자", "파렛트"]
      unit_weight_kg: 20
      label: "상자·파렛트 20kg"
      # 🔴 2018-01-01 이전은 18kg 이 표준이었다. ML spec_desc 가 그렇게 적고 있고
      #   ("상자·파렛트 20kg (2018년 이전 18kg)"), 우리 IO명세도 "무 규격 2018 전
      #   18kg(백테스트 주의)"로 적어두었는데 코드에는 없었다.
      #   20kg 로 고정하면 2017년 244 거래일 중 **64일만** 잡힌다 (18kg 는 227일) —
      #   에러 없이 다른 시리즈가 된다.
      #
      #   ⚠️ 두 중량을 목록으로 합치지 않는다. 2017년에 18kg 과 20kg 이 **둘 다** 있어서
      #     한 날에 섞인다. 전환일 기준으로 하나만 고른다.
      before:
        date: 2018-01-01
        unit_weight_kg: 18
        label: "상자·파렛트 18kg"
    양파: {packages: ["그물망", "파렛트"], unit_weight_kg: 15, label: "그물망·파렛트 15kg"}
    # 피마늘은 **null 이다 — 0 이나 임의 규격으로 채우지 않는다** (규칙 3).
    # 근거 둘: ① ML 에 피마늘 AUC 예측 자체가 없다 ② 원천 테이블의 품목명은 "마늘"이고
    # 품종 목록(저장형 한지·햇마늘 대서·홍산·쪽·깐마늘…)에 "피마늘"이 없다. 어느 이름으로
    # 조회할지가 미결이라 조회하지 않고, 그 사실을 사유로 내보낸다.
    피마늘: null

allocation:
  item_split_rule: "원안비율"         # 품목 안분 기본 규칙. 예외 = 예측신뢰도 가중
  # ③이 수량을 금액으로 환산할 때와 ⑤가 배분의 기준으로 삼는 등급.
  # ⑤가 중품을 섞으면 실제 매입단가는 이 값보다 **낮아지므로**, ③의 현금 상한은 항상
  # 보수적인 쪽으로 어긋난다 — ⑦의 금액 검사가 그 때문에 새로 걸리는 일은 없다.
  reference_grade: "상"
  # 허용 축이 여럿일 때 공격안이 가져가는 축. 선매입은 "언제 살 것인가"를 정하는
  # 결정이라 timing이 자연스럽다. 축이 하나뿐인 날엔 이 배정이 일어나지 않는다.
  aggressive_axis: "timing"

# 품목별 보관한계(일). 단일 확정값이 있는 것만 채운다 — 규칙 3
shelf_life_days:
  배추: 135
  양파: null                         # 상세설계 §7 "8~9개월" — 범위라 단일값 미확정
  무: null                           # "상온" — 일수 규정 없음
  피마늘: null                        # "상온" — 일수 규정 없음

# ⑥ feedback 재조정 — 오케스트레이터가 전부 기각했을 때만 온다
feedback:
  # ⚠️ **우리 코드는 이 값을 아직 읽지 않는다.** 재시도 상한을 실제로 집행하는 쪽은
  #   마스터다 (`app/master/flow.py` `max_purchase_attempts`, 기본 2). 여기 있는 건
  #   IO명세 §1이 규정한 **우리 쪽 선언**이고, 두 값이 갈라지면 "2회까지"라는 말이
  #   두 뜻을 갖게 된다. 우리가 재시도 루프를 갖게 되는 날 이 값을 읽고, 그때
  #   "설정에서 읽는지"를 잠그는 검사를 함께 만든다 (규칙 8).
  attempt_max: 2                    # 2 초과 요청은 거부하고 "제안 불가"를 반환 (IO명세 §1)

# 미결 파라미터 — 값이 아니라 **계산을 막는 장치**다 (정의서 §1.2-10 · §9.1 게이트 ②)
pending:
  # N4. 0으로 채우면 "오늘 승인분이 오늘 도착"이 되어 on_hand 전환 금지가 무의미해진다.
  # NULL인 동안 expected_arrival_date(= as_of + N4)를 계산하지 않는다.
  inbound_lead_days: null
  # N5. 0으로 채우면 D+0 즉시지급이 되어 운전자금이 과대 계상된다.
  # payment_date(= as_of + N5)를 계산하지 않는다.
  purchase_payment_days: null
