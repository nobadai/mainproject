[project]
name = "mainproject-backend"
version = "0.1.0"
description = "FastAPI backend for mainproject"
requires-python = ">=3.12,<3.13"
dependencies = [
  "anthropic>=1.0.0",
  "fastapi[standard]==0.141.1",
  "langchain-core>=1.6.0",
  "langgraph>=1.2.11",
  "openai>=3.3.1",
  "psycopg[binary]",
  "python-dotenv",
  "pyyaml>=6.0.3",
  "uvicorn[standard]==0.52.1",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "ruff==0.16.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
exclude = [".venv", "venv", "deploy"]

[tool.ruff.lint]
# line-length는 설정만으로 강제되지 않는다 — E501이 ruff 기본 select에 없어서
# `ruff check`가 긴 줄을 그냥 통과시킨다. CLAUDE.md가 "line-length 100"을 규율로
# 적어둔 이상 실제로 걸리게 한다. select가 아니라 extend-select인 이유: 기본 규칙
# (TRY/FURB/UP/RUF 등)을 덮어쓰지 않고 더하기만 하기 위해서다.
extend-select = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# 실 LLM 프로바이더(API 키 또는 로컬 서버)가 있어야만 도는 테스트에 붙인다.
# addopts로 기본 제외하므로 `uv run pytest`는 키·서버 없이 그대로 돈다 —
# 마커가 없는 기존 테스트는 `not llm`에 전부 걸리므로 영향이 없다.
#
# `db`도 같은 이유다 (#70). 등급별 시세를 실제 DB에서 읽는 테스트만 붙인다 —
# 스위트가 DB에 묶이면 사내망 밖에서 전원 빨간불이 되고, 그러면 아무도 스위트를 안 믿는다.
# 조회 결과를 시세 형태로 옮기는 부분(가중·반올림·정렬·등급 어휘·규격 필터)은 가짜 fetch로
# 전부 시험되므로, 이 마커가 빠져도 검사 커버리지가 비지 않는다.
markers = [
    "llm: 실 LLM 프로바이더 필요 (기본 실행에서 제외)",
    "db: 실 PostgreSQL 연결 필요 (기본 실행에서 제외) — `uv run pytest -m db`",
]
addopts = "-m 'not llm and not db'"
