[project]
name = "mainproject-backend"
version = "0.1.0"
description = "FastAPI backend for mainproject"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi[standard]==0.141.1",
  "psycopg[binary]",
  "python-dotenv",
  "pyyaml>=6.0.3",
  "uvicorn[standard]==0.52.1",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "ruff==0.16.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
exclude = [".venv", "venv", "deploy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
