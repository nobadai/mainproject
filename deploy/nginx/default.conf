events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            # 요청한 주소 뒤에 .html을 붙여서 찾아보고, 없으면 404 페이지로 이동
            try_files $uri $uri.html $uri/ /404.html;
        }
    }
}



