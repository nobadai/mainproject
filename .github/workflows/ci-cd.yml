name: CI/CD

# main 브랜치에 push 되면 CI → 이미지 빌드 → 대상 PC 배포 순으로 진행합니다.
# PR 에서는 CI 와 빌드까지만 하고, 이미지 push 와 배포는 하지 않습니다.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  BACKEND_IMAGE_NAME: ghcr.io/${{ github.repository }}-backend
  FRONTEND_IMAGE_NAME: ghcr.io/${{ github.repository }}-frontend

jobs:
  # ─────────────────────────────────────────────
  # CI: GitHub 클라우드 러너에서 린트/테스트
  # ─────────────────────────────────────────────
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.0"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest -q

  # ─────────────────────────────────────────────
  # Frontend CI: GitHub 클라우드 러너에서 린트/빌드
  # ─────────────────────────────────────────────
  frontend-ci:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ─────────────────────────────────────────────
  # 이미지 빌드 → GHCR push (클라우드 러너에서 수행)
  # ─────────────────────────────────────────────
  build:
    name: Build images
    needs: [ci, frontend-ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PR 에서는 빌드가 깨지지 않는지만 확인하고 push 는 하지 않습니다.
      - name: Build and push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE_NAME }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE_NAME }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=min,scope=frontend

  # ─────────────────────────────────────────────
  # CD: 대상 Windows PC(self-hosted 러너)에서 컨테이너 교체
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Windows PC
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [self-hosted, windows]
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      APP_NAME: mainproject
      APP_PORT: "8000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Docker CLI to PATH
        shell: cmd
        env:
          DOCKER_CLI_DIR: ${{ vars.DOCKER_CLI_DIR }}
        run: |
          if not defined DOCKER_CLI_DIR (
            echo ::error title=Docker CLI path missing::Repository variable DOCKER_CLI_DIR is not configured.
            exit /b 1
          )
          if not exist "%DOCKER_CLI_DIR%\docker.exe" (
            echo ::error title=Docker CLI not found::docker.exe was not found in DOCKER_CLI_DIR: %DOCKER_CLI_DIR%
            exit /b 1
          )
          echo %DOCKER_CLI_DIR%>>"%GITHUB_PATH%"

      - name: Verify Docker CLI, daemon, and Compose
        shell: cmd
        run: |
          where docker
          if errorlevel 1 (
            echo ::error title=Docker CLI unavailable::docker.exe is not available on PATH after configuring DOCKER_CLI_DIR.
            exit /b 1
          )
          docker version
          if errorlevel 1 (
            echo ::error title=Docker daemon unavailable::Docker CLI was found, but the runner could not connect to the Docker daemon.
            exit /b 1
          )
          docker compose version
          if errorlevel 1 (
            echo ::error title=Docker Compose unavailable::The Docker Compose plugin is not available to the runner.
            exit /b 1
          )

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # cmd 를 거쳐 PowerShell 을 호출합니다.
      #  - pwsh(PowerShell 7)는 별도 설치가 필요하므로 쓰지 않습니다.
      #  - shell: powershell 로 직접 실행하면 GitHub 이 만든 임시 .ps1 이
      #    실행 정책(기본 Restricted)에 걸립니다. cmd 에는 실행 정책이
      #    적용되지 않으므로, 여기서 -ExecutionPolicy Bypass 로 넘깁니다.
      - name: Deploy
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File deploy\deploy.ps1
        env:
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
          APP_VERSION: ${{ github.sha }}
