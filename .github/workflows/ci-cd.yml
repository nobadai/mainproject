name: CI/CD

# main 브랜치에 push 되면 CI(빌드·테스트) 후 self-hosted 러너로 배포합니다.
# PR 에서는 CI 만 돌고 배포는 하지 않습니다. 수동 실행(workflow_dispatch)도 지원합니다.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 같은 브랜치의 이전 실행은 취소해 중복 실행을 막습니다.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # CI: GitHub 클라우드 러너에서 빌드/린트/테스트
  # ─────────────────────────────────────────────
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest -q

  # ─────────────────────────────────────────────
  # CD: 대상 Windows PC(self-hosted 러너)에서 배포
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Windows PC
    needs: ci
    # main 브랜치 push (또는 수동 실행) 일 때만 배포. PR 에서는 배포 안 함.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [self-hosted, windows]
    # 배포는 동시에 하나만 실행되도록 잠금(취소하지 않고 대기).
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DEPLOY_DIR: C:\apps\mainproject # 대상 PC 의 실제 배포 경로
      APP_NAME: mainproject # 스케줄드 태스크(서비스) 이름
      APP_PORT: "8000" # 앱이 리슨할 포트
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Windows 기본 탑재인 Windows PowerShell 5.1 을 사용합니다.
      # pwsh(PowerShell 7)는 별도 설치가 필요하므로 의존하지 않습니다.
      - name: Deploy
        shell: powershell
        run: .\deploy\deploy.ps1
