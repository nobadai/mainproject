services:
  backend:
    image: ${BACKEND_IMAGE:-mainproject-backend:local}
    build:
      context: ./backend
    container_name: mainproject-backend
    environment:
      APP_VERSION: "${APP_VERSION:-dev}"
      DB_HOST: "${DB_HOST:?DB_HOST is required}"
      DB_PORT: "${DB_PORT:?DB_PORT is required}"
      DB_NAME: "${DB_NAME:?DB_NAME is required}"
      DB_USER: "${DB_USER:?DB_USER is required}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      DB_SCHEMA: "${DB_SCHEMA:?DB_SCHEMA is required}"
      # Every runtime provider setting is a required GitHub Secret in
      # production.  This fails deployment rather than silently falling back
      # when a Secret has not been registered.
      LLM_ENABLED: "${LLM_ENABLED:?LLM_ENABLED is required}"
      LLM_PROVIDER: "${LLM_PROVIDER:?LLM_PROVIDER is required}"
      LLM_MODEL: "${LLM_MODEL:?LLM_MODEL is required}"
      LLM_BASE_URL: "${LLM_BASE_URL:?LLM_BASE_URL is required}"
      LLM_TIMEOUT_SECONDS: "${LLM_TIMEOUT_SECONDS:?LLM_TIMEOUT_SECONDS is required}"
      LLM_MAX_RETRIES: "${LLM_MAX_RETRIES:?LLM_MAX_RETRIES is required}"
      LLM_MAX_OUTPUT_TOKENS: "${LLM_MAX_OUTPUT_TOKENS:?LLM_MAX_OUTPUT_TOKENS is required}"
      LLM_EFFORT: "${LLM_EFFORT:?LLM_EFFORT is required}"
      MASTER_LLM_ENABLED: "${MASTER_LLM_ENABLED:?MASTER_LLM_ENABLED is required}"
      MASTER_LLM_PROVIDER: "${MASTER_LLM_PROVIDER:?MASTER_LLM_PROVIDER is required}"
      MASTER_LLM_MODEL: "${MASTER_LLM_MODEL:?MASTER_LLM_MODEL is required}"
      MASTER_LLM_BASE_URL: "${MASTER_LLM_BASE_URL:?MASTER_LLM_BASE_URL is required}"
      CRITIC_LLM_ENABLED: "${CRITIC_LLM_ENABLED:?CRITIC_LLM_ENABLED is required}"
      CRITIC_LLM_PROVIDER: "${CRITIC_LLM_PROVIDER:?CRITIC_LLM_PROVIDER is required}"
      CRITIC_LLM_MODEL: "${CRITIC_LLM_MODEL:?CRITIC_LLM_MODEL is required}"
      CRITIC_LLM_BASE_URL: "${CRITIC_LLM_BASE_URL:?CRITIC_LLM_BASE_URL is required}"
      FINANCE_LLM_ENABLED: "${FINANCE_LLM_ENABLED:?FINANCE_LLM_ENABLED is required}"
      FINANCE_LLM_PROVIDER: "${FINANCE_LLM_PROVIDER:?FINANCE_LLM_PROVIDER is required}"
      FINANCE_LLM_MODEL: "${FINANCE_LLM_MODEL:?FINANCE_LLM_MODEL is required}"
      FINANCE_LLM_BASE_URL: "${FINANCE_LLM_BASE_URL:?FINANCE_LLM_BASE_URL is required}"
      FINANCE_OLLAMA_PLANNER_MODEL: "${FINANCE_OLLAMA_PLANNER_MODEL:?FINANCE_OLLAMA_PLANNER_MODEL is required}"
      SALES_LLM_ENABLED: "${SALES_LLM_ENABLED:?SALES_LLM_ENABLED is required}"
      SALES_LLM_PROVIDER: "${SALES_LLM_PROVIDER:?SALES_LLM_PROVIDER is required}"
      SALES_LLM_MODEL: "${SALES_LLM_MODEL:?SALES_LLM_MODEL is required}"
      LOGISTICS_LLM_ENABLED: "${LOGISTICS_LLM_ENABLED:?LOGISTICS_LLM_ENABLED is required}"
      LOGISTICS_LLM_PROVIDER: "${LOGISTICS_LLM_PROVIDER:?LOGISTICS_LLM_PROVIDER is required}"
      LOGISTICS_LLM_MODEL: "${LOGISTICS_LLM_MODEL:?LOGISTICS_LLM_MODEL is required}"
      LOGISTICS_LLM_BASE_URL: "${LOGISTICS_LLM_BASE_URL:?LOGISTICS_LLM_BASE_URL is required}"
      LOGISTICS_MASTER_LLM_ENABLED: "${LOGISTICS_MASTER_LLM_ENABLED:?LOGISTICS_MASTER_LLM_ENABLED is required}"
      PURCHASE_LLM_ENABLED: "${PURCHASE_LLM_ENABLED:?PURCHASE_LLM_ENABLED is required}"
      PURCHASE_LLM_PROVIDER: "${PURCHASE_LLM_PROVIDER:?PURCHASE_LLM_PROVIDER is required}"
      PURCHASE_LLM_MODEL: "${PURCHASE_LLM_MODEL:?PURCHASE_LLM_MODEL is required}"
      PURCHASE_LLM_BASE_URL: "${PURCHASE_LLM_BASE_URL:?PURCHASE_LLM_BASE_URL is required}"
      ML_LLM_ENABLED: "${ML_LLM_ENABLED:?ML_LLM_ENABLED is required}"
      ML_LLM_MODEL: "${ML_LLM_MODEL:?ML_LLM_MODEL is required}"
      ML_CONSOLE_ORIGIN: "${ML_CONSOLE_ORIGIN:?ML_CONSOLE_ORIGIN is required}"
      GEMINI_BASE_URL: "${GEMINI_BASE_URL:?GEMINI_BASE_URL is required}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY is required}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:?OPENAI_API_KEY is required}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:?GEMINI_API_KEY is required}"
      MASTER_GEMINI_API_KEY: "${MASTER_GEMINI_API_KEY:?MASTER_GEMINI_API_KEY is required}"
      CRITIC_GEMINI_API_KEY: "${CRITIC_GEMINI_API_KEY:?CRITIC_GEMINI_API_KEY is required}"
      FINANCE_GEMINI_API_KEY: "${FINANCE_GEMINI_API_KEY:?FINANCE_GEMINI_API_KEY is required}"
      SALES_GEMINI_API_KEY: "${SALES_GEMINI_API_KEY:?SALES_GEMINI_API_KEY is required}"
      LOGISTICS_GEMINI_API_KEY: "${LOGISTICS_GEMINI_API_KEY:?LOGISTICS_GEMINI_API_KEY is required}"
      ML_GEMINI_API_KEY: "${ML_GEMINI_API_KEY:?ML_GEMINI_API_KEY is required}"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-mainproject-frontend:local}
    build:
      context: ./frontend
    container_name: mainproject-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    restart: unless-stopped
