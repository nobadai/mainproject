services:
  backend:
    image: ${BACKEND_IMAGE:-mainproject-backend:local}
    build:
      context: ./backend
    container_name: mainproject-backend
    environment:
      APP_VERSION: "${APP_VERSION:-dev}"
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-mainproject-frontend:local}
    build:
      context: ./frontend
    container_name: mainproject-frontend
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  nginx:
    image: nginx:1.29-alpine
    container_name: mainproject-nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
