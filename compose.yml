services:
  backend:
    image: ${BACKEND_IMAGE:-mainproject-backend:local}
    build:
      context: ./backend
    container_name: mainproject-backend
    environment:
      APP_VERSION: "${APP_VERSION:-dev}"
      DB_HOST: "${DB_HOST:?DB_HOST is required}"
      DB_PORT: "${DB_PORT:?DB_PORT is required}"
      DB_NAME: "${DB_NAME:?DB_NAME is required}"
      DB_USER: "${DB_USER:?DB_USER is required}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      DB_SCHEMA: "${DB_SCHEMA:?DB_SCHEMA is required}"
      # Only settings registered for this deployment are injected.  Absent
      # optional provider settings keep the backend's own default behavior.
      LLM_ENABLED: "${LLM_ENABLED:?LLM_ENABLED is required}"
      LLM_PROVIDER: "${LLM_PROVIDER:?LLM_PROVIDER is required}"
      LLM_MODEL: "${LLM_MODEL:?LLM_MODEL is required}"
      LLM_BASE_URL: "${LLM_BASE_URL:?LLM_BASE_URL is required}"
      LLM_TIMEOUT_SECONDS: "${LLM_TIMEOUT_SECONDS:?LLM_TIMEOUT_SECONDS is required}"
      LLM_MAX_RETRIES: "${LLM_MAX_RETRIES:?LLM_MAX_RETRIES is required}"
      MASTER_LLM_PROVIDER: "${MASTER_LLM_PROVIDER:?MASTER_LLM_PROVIDER is required}"
      CRITIC_LLM_PROVIDER: "${CRITIC_LLM_PROVIDER:?CRITIC_LLM_PROVIDER is required}"
      CRITIC_LLM_TIMEOUT_SECONDS: "${CRITIC_LLM_TIMEOUT_SECONDS:?CRITIC_LLM_TIMEOUT_SECONDS is required}"
      FINANCE_LLM_ENABLED: "${FINANCE_LLM_ENABLED:?FINANCE_LLM_ENABLED is required}"
      FINANCE_LLM_PROVIDER: "${FINANCE_LLM_PROVIDER:?FINANCE_LLM_PROVIDER is required}"
      FINANCE_LLM_MODEL: "${FINANCE_LLM_MODEL:?FINANCE_LLM_MODEL is required}"
      SALES_LLM_ENABLED: "${SALES_LLM_ENABLED:?SALES_LLM_ENABLED is required}"
      SALES_LLM_PROVIDER: "${SALES_LLM_PROVIDER:?SALES_LLM_PROVIDER is required}"
      SALES_LLM_MODEL: "${SALES_LLM_MODEL:?SALES_LLM_MODEL is required}"
      ML_CONSOLE_ORIGIN: "${ML_CONSOLE_ORIGIN:?ML_CONSOLE_ORIGIN is required}"
      ML_SOURCE_DB_HOST: "${ML_SOURCE_DB_HOST:?ML_SOURCE_DB_HOST is required}"
      ML_SOURCE_DB_PORT: "${ML_SOURCE_DB_PORT:?ML_SOURCE_DB_PORT is required}"
      ML_SOURCE_DB_NAME: "${ML_SOURCE_DB_NAME:?ML_SOURCE_DB_NAME is required}"
      ML_SOURCE_DB_USER: "${ML_SOURCE_DB_USER:?ML_SOURCE_DB_USER is required}"
      ML_SOURCE_DB_PASSWORD: "${ML_SOURCE_DB_PASSWORD:?ML_SOURCE_DB_PASSWORD is required}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:?GEMINI_API_KEY is required}"
      MASTER_GEMINI_API_KEY: "${MASTER_GEMINI_API_KEY:?MASTER_GEMINI_API_KEY is required}"
      FINANCE_GEMINI_API_KEY: "${FINANCE_GEMINI_API_KEY:?FINANCE_GEMINI_API_KEY is required}"
      SALES_GEMINI_API_KEY: "${SALES_GEMINI_API_KEY:?SALES_GEMINI_API_KEY is required}"
      ML_GEMINI_API_KEY: "${ML_GEMINI_API_KEY:?ML_GEMINI_API_KEY is required}"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-mainproject-frontend:local}
    build:
      context: ./frontend
    container_name: mainproject-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    restart: unless-stopped
