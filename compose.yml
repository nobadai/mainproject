services:
  backend:
    image: ${BACKEND_IMAGE:-mainproject-backend:local}
    build:
      context: ./backend
    container_name: mainproject-backend
    environment:
      APP_VERSION: "${APP_VERSION:-dev}"
      DB_HOST: "${DB_HOST:?DB_HOST is required}"
      DB_PORT: "${DB_PORT:?DB_PORT is required}"
      DB_NAME: "${DB_NAME:?DB_NAME is required}"
      DB_USER: "${DB_USER:?DB_USER is required}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      DB_SCHEMA: "${DB_SCHEMA:?DB_SCHEMA is required}"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-mainproject-frontend:local}
    build:
      context: ./frontend
    container_name: mainproject-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    restart: unless-stopped
