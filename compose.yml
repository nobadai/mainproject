services:
  backend:
    image: ${BACKEND_IMAGE:-mainproject-backend:local}
    build:
      context: ./backend
    container_name: mainproject-backend
    environment:
      APP_VERSION: "${APP_VERSION:-dev}"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-mainproject-frontend:local}
    build:
      context: ./frontend
    container_name: mainproject-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    restart: unless-stopped
